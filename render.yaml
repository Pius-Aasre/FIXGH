# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — FixGH Platform (Backend API + AI Service)
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Python AI Microservice (FastAPI / Docker) ───────────────────────────
  # Deployed FIRST so fixgh-backend can reference its URL
  - type: web
    name: fixgh-ai
    runtime: docker
    region: oregon
    plan: free
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  # ── 2. Node.js Backend API ──────────────────────────────────────────────────
  - type: web
    name: fixgh-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Supabase PostgreSQL — set manually in Render dashboard
      # Supabase → Settings → Database → Connection string → Session mode URI
      - key: DATABASE_URL
        sync: false
      # Supabase → Settings → Database → Direct connection URI (for migrations)
      - key: DIRECT_URL
        sync: false

      # JWT — run: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      # Cloudinary — cloudinary.com → Dashboard → API Keys
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email — resend.com → API Keys
      - key: RESEND_API_KEY
        sync: false
      # Resend's free test sender. Only permitted to deliver to the account
      # owner's own inbox — verify a domain before sending to real recipients.
      - key: EMAIL_FROM
        value: FixGH Alerts <onboarding@resend.dev>
      # TEST MODE — redirect every outbound email to a single inbox.
      # Set to an empty value once a sending domain is verified.
      - key: EMAIL_TEST_RECIPIENT
        sync: false
      # Authority dashboard base URL used in the emailed report link
      - key: DASHBOARD_URL
        value: https://fixgh-dashboard.vercel.app

      # AI Service — auto-wired from fixgh-ai (no copy-paste needed)
      - key: AI_SERVICE_URL
        fromService:
          name: fixgh-ai
          type: web
          property: host

      # CORS — set to your Vercel URL e.g. https://fixgh-dashboard.vercel.app
      - key: CORS_ORIGIN
        sync: false
