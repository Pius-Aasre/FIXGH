# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — FixGH Platform (Backend API + AI Service)
# Docs: https://render.com/docs/blueprint-spec
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Python AI Microservice (FastAPI / Docker) ───────────────────────────
  # Deployed FIRST so fixgh-backend can reference its URL
  - type: web
    name: fixgh-ai
    runtime: docker
    region: oregon
    plan: free
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  # ── 2. Node.js Backend API ──────────────────────────────────────────────────
  - type: web
    name: fixgh-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Supabase PostgreSQL — set manually in Render dashboard
      # Supabase → Settings → Database → Connection string → Session mode URI
      - key: DATABASE_URL
        sync: false
      # Supabase → Settings → Database → Direct connection URI (for migrations)
      - key: DIRECT_URL
        sync: false

      # JWT — run: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      # Cloudinary — cloudinary.com → Dashboard → API Keys
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Email — resend.com → API Keys
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@fixgh.org

      # AI Service — auto-wired from fixgh-ai (no copy-paste needed)
      - key: AI_SERVICE_URL
        fromService:
          name: fixgh-ai
          type: web
          property: host

      # Firebase (optional — leave blank to use local JSON fallback)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # CORS — set to your Vercel URL e.g. https://fixgh-dashboard.vercel.app
      - key: CORS_ORIGIN
        sync: false
